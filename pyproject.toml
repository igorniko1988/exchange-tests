[project]
name = "exchange-tests"
version = "0.1.0"
description = "API and UI automation framework for the exchange service"
readme = "README.md"
authors = [
    { name = "niko" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "framework"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
