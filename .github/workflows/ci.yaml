name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: igorniko1988/tests
          path: stand
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - name: Start stand
        working-directory: stand
        run: docker compose up -d --build db exchange
      - name: Wait for stand
        run: >
          curl --fail --silent --show-error
          --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --retry-max-time 120
          http://localhost:8080/health
      - name: Smoke tests
        run: uv run pytest -m smoke --alluredir=allure-results
      - name: All tests
        run: uv run pytest --alluredir=allure-results
      - name: Stand logs
        if: failure()
        working-directory: stand
        run: docker compose logs
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          retention-days: 7

  report:                                          # НОВАЯ job
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
      - name: Check results for leaked tokens      # защита перед публикацией
        run: |
          if grep -rq "eyJ" allure-results; then
            echo "possible JWT token in allure-results"
            exit 1
          fi
      - name: Install Allure
        run: npm install -g allure
      - name: Build report
        run: allure generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 7
      - name: Upload report for Pages              # только на main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy:                                          # НОВАЯ job: публикация
    needs: report
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.report.result == 'success'
    runs-on: ubuntu-latest
    permissions:                                   # права только для этой job
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5