name: ci                          # имя, оно показывается во вкладке Actions и в Checks

on:                               # когда запускать
  pull_request:                   # на каждый PR (двоеточие, значение пустое)
  push:                           # на каждый пуш...
    branches: [main]              # ...но только в ветку main

jobs:                             # набор задач
  lint:                           # имя задачи (любое), оно же имя проверки в PR
    runs-on: ubuntu-latest        # на какой машине запускать (без точки с запятой!)
    timeout-minutes: 10           # убить задачу, если висит дольше 10 минут
    steps:                        # шаги задачи, идут по порядку
      - uses: actions/checkout@v7            # готовое действие: забрать код репозитория
      - uses: astral-sh/setup-uv@v10.3.3     # готовое действие: поставить uv
      - run: uv sync                         # своя команда: поставить зависимости проекта
      - run: uv run ruff check               # своя команда: линтер
      - run: uv run ruff format --check      # своя команда: проверка форматирования