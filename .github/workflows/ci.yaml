name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:                      # права токена: только чтение кода
  contents: read

concurrency:                      # один активный запуск на ветку
  group: ${{ github.workflow }}-${{ github.ref }}      # группа: имя workflow + ветка
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # отменять старый только на PR

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:                                   # входы действия
          enable-cache: true                    # кэш зависимостей uv
          cache-dependency-glob: uv.lock        # ключ кэша зависит от uv.lock
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check