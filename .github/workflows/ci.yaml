name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7                  # ваш код
      - uses: actions/checkout@v7                  # стенд в подпапку stand
        with:
          repository: igorniko1988/tests
          path: stand
      - uses: astral-sh/setup-uv@v10.3.3           # НОВОЕ: установить uv (с кэшем)
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync                               # НОВОЕ: зависимости проекта
      - name: Start stand
        working-directory: stand
        run: docker compose up -d --build db exchange
      - name: Wait for stand
        run: >
          curl --fail --silent --show-error
          --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --retry-max-time 120
          http://localhost:8080/health
      - name: Smoke tests                          # НОВОЕ: быстрый прогон первым
        run: uv run pytest -m smoke
      - name: All tests                            # НОВОЕ: полный набор
        run: uv run pytest
      - name: Stand logs
        if: failure()
        working-directory: stand
        run: docker compose logs